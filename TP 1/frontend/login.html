<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sistema de gestión de usuarios UTN — Iniciar sesión" />
  <title>Iniciar Sesión — UTN Sistema</title>
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>

  <main class="login-card" role="main">

    <!-- Header -->
    <header class="login-header">
      <div class="login-logo" aria-hidden="true">🎓</div>
      <h1 class="login-title">Sistema UTN</h1>
      <p class="login-subtitle">Gestión de Usuarios Académicos</p>
    </header>

    <!-- Login form -->
    <form id="loginForm" class="login-form" novalidate aria-label="Formulario de inicio de sesión">

      <div class="form-group">
        <label class="form-label" for="usuario">Usuario</label>
        <input
          id="usuario"
          name="usuario"
          type="text"
          class="form-input"
          placeholder="Ingresá tu usuario"
          autocomplete="username"
          maxlength="50"
          required
          aria-describedby="usuarioError"
        />
        <span id="usuarioError" class="field-error" role="alert" aria-live="polite"></span>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          class="form-input"
          placeholder="Ingresá tu contraseña"
          autocomplete="current-password"
          maxlength="100"
          required
          aria-describedby="passwordError"
        />
        <span id="passwordError" class="field-error" role="alert" aria-live="polite"></span>
      </div>

      <button
        id="submitBtn"
        type="submit"
        class="btn-login"
        aria-label="Iniciar sesión"
      >
        <span id="btnSpinner" class="spinner hidden" aria-hidden="true"></span>
        <span id="btnText">Iniciar sesión</span>
      </button>

    </form>

    <!-- Global alert (API error) -->
    <div
      id="loginAlert"
      class="alert alert-error hidden"
      role="alert"
      aria-live="assertive"
    ></div>

    <footer class="login-footer">
      <p>UTN — Programación IV &copy; 2024</p>
    </footer>

  </main>

  <!-- Scripts loaded at end of body for performance -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>

</body>
</html>
